# Used with docker-compose.yml and docker-compose.fake-llm.yml; see
# tests/integration/run.sh.
x-app-env: &app-env
  AGENTS_SERVER_ADDR: 0.0.0.0:8080
  DATABASE_URL: postgresql://postgres:postgres@postgres:5432/agents_at_scale
  REDIS_URL: redis://redis:6379/0
  RABBITMQ_URL: amqp://agents:agents@rabbitmq:5672/
  RABBITMQ_QUEUE: agent_jobs_e2e_python
  DATA_ACCESS: ${DATA_ACCESS:-orm}

services:
  api:
    environment: *app-env
  worker:
    environment:
      <<: *app-env
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
  postgres:
    ports: !override ["15433:5432"]
    volumes: !override
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ../tests/integration/fixtures.sql:/docker-entrypoint-initdb.d/002_fixtures.sql:ro
  redis:
    ports: !override ["16380:6379"]
    volumes: !override []
  rabbitmq:
    image: rabbitmq:4-management
    user: "999:999"
    ports: !override ["25674:5672", "25675:15672"]
    volumes: !override []
    tmpfs:
      - /var/lib/rabbitmq:uid=999,gid=999,mode=0700
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      start_period: 30s
      interval: 5s
      timeout: 5s
      retries: 30
