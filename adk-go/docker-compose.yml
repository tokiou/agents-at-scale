x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  env_file:
    - .env
  # Same explicit file descriptor limit for both runtimes (Go raises its own
  # soft limit at startup; Python keeps the container default of 1024).
  ulimits:
    nofile:
      soft: 65536
      hard: 65536
  depends_on: &infra
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy

services:
  # HTTP entrypoint: publishes jobs only and runs the schema migrations of
  # the agent session store before workers start.
  api:
    <<: *app
    environment:
      WORKER_CONCURRENCY: "0"
      RUN_MIGRATIONS: "true"
    deploy:
      resources:
        limits:
          cpus: "${API_CPUS:-1}"
          memory: ${API_MEMORY:-512m}
    ports:
      - "${APP_PORT}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Job consumers. Scale with WORKER_REPLICAS; each replica runs
  # WORKER_CONCURRENCY jobs at once within WORKER_CPUS / WORKER_MEMORY.
  worker:
    <<: *app
    environment:
      RUN_MIGRATIONS: "false"
    deploy:
      replicas: ${WORKER_REPLICAS:-1}
      resources:
        limits:
          cpus: "${WORKER_CPUS:-1}"
          memory: ${WORKER_MEMORY:-1g}
    depends_on:
      <<: *infra
      api:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    command: ["postgres", "-c", "max_connections=${POSTGRES_MAX_CONNECTIONS:-300}"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
