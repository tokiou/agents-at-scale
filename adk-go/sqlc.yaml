version: "2"
sql:
  - engine: postgresql
    schema: db/schema.sql
    queries: db/query
    gen:
      go:
        package: sqlc
        out: internal/platform/postgres/sqlc
        sql_package: pgx/v5
        emit_json_tags: true
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              package: uuid
              type: UUID
          - db_type: "pg_catalog.numeric"
            go_type:
              import: "github.com/shopspring/decimal"
              package: decimal
              type: Decimal
